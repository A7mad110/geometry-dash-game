<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geometry Dash - النسخة الاحترافية</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body { background: #000; overflow: hidden; font-family: 'Cairo', sans-serif; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* واجهة المستخدم */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .screen { 
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
        background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); 
        transition: opacity 0.3s; opacity: 0; pointer-events: none;
    }
    .screen.active { opacity: 1; pointer-events: all; }

    h1 { font-size: 3.5rem; color: #fff; text-shadow: 0 0 20px #0ff; margin-bottom: 10px; text-align: center; }
    h2 { color: #ccc; margin-bottom: 30px; font-size: 1.5rem; }
    
    .btn {
        padding: 15px 50px; font-size: 1.5rem; border: none; border-radius: 50px;
        background: linear-gradient(45deg, #00d2ff, #3a7bd5); color: #fff;
        cursor: pointer; margin: 10px; box-shadow: 0 0 20px rgba(0,210,255,0.5);
        font-family: 'Cairo', sans-serif; font-weight: bold; transition: 0.2s;
        pointer-events: auto;
    }
    .btn:hover { transform: scale(1.1); box-shadow: 0 0 30px rgba(0,210,255,0.8); }
    .btn.red { background: linear-gradient(45deg, #ff416c, #ff4b2b); box-shadow: 0 0 20px rgba(255,65,108,0.5); }
    .btn.green { background: linear-gradient(45deg, #11998e, #38ef7d); box-shadow: 0 0 20px rgba(56,239,125,0.5); }

    /* HUD أثناء اللعب */
    #hud { display: none; position: absolute; top: 0; left: 0; width: 100%; padding: 20px; justify-content: space-between; align-items: center; pointer-events: none; }
    .progress-bar { flex: 1; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; margin: 0 20px; overflow: hidden; }
    .fill { height: 100%; background: #0ff; width: 0%; box-shadow: 0 0 10px #0ff; transition: width 0.1s linear; }
    .stats { color: #fff; font-size: 1.2rem; font-weight: bold; text-shadow: 0 2px 5px #000; }
    .pause-btn { pointer-events: auto; background: rgba(255,255,255,0.2); border: 2px solid #fff; color: #fff; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }

    /* اختيار المراحل */
    .level-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
    .level-card {
        width: 160px; height: 160px; background: #222; border-radius: 20px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        cursor: pointer; border: 3px solid transparent; transition: 0.3s; pointer-events: auto;
    }
    .level-card:hover { transform: translateY(-10px); border-color: #0ff; background: #333; }
    .lvl-num { font-size: 3rem; color: #fff; font-weight: 900; }
    .lvl-name { color: #aaa; margin-top: 5px; font-size: 1rem; }
    .lvl-diff { font-size: 0.8rem; padding: 3px 10px; border-radius: 10px; margin-top: 5px; }

    /* ألوان الصعوبة */
    .easy { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
    .medium { background: rgba(241, 196, 15, 0.2); color: #f1c40f; }
    .hard { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
    .insane { background: rgba(155, 89, 182, 0.2); color: #9b59b6; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <!-- القائمة الرئيسية -->
    <div id="mainMenu" class="screen active">
        <h1>GEOMETRY DASH</h1>
        <h2>النسخة العربية الاحترافية</h2>
        <button class="btn" onclick="showScreen('levelSelect')">🎮 ابدأ اللعب</button>
        <button class="btn red" onclick="clearData()">🗑️ حذف التقدم</button>
    </div>

    <!-- اختيار المرحلة -->
    <div id="levelSelect" class="screen">
        <h2 style="color:#fff">اختر المرحلة</h2>
        <div class="level-grid" id="levelsContainer"></div>
        <button class="btn red" onclick="showScreen('mainMenu')" style="margin-top:30px">رجوع</button>
    </div>

    <!-- شاشة الفوز -->
    <div id="winScreen" class="screen">
        <h1 style="color:#2ecc71; text-shadow:0 0 20px #2ecc71">🎉 مرحلة مكتملة!</h1>
        <p id="winText" style="color:#fff; font-size:1.5rem; margin:20px"></p>
        <button class="btn green" onclick="nextLevel()">المرحلة التالية ▶️</button>
        <button class="btn" onclick="restartLevel()">إعادة 🔄</button>
        <button class="btn red" onclick="showScreen('mainMenu')">خروج 🏠</button>
    </div>

    <!-- شاشة الخسارة -->
    <div id="deathScreen" class="screen">
        <h1 style="color:#e74c3c; text-shadow:0 0 20px #e74c3c">💀 تحطمت!</h1>
        <p id="deathText" style="color:#fff; font-size:1.5rem; margin:20px"></p>
        <button class="btn green" onclick="restartLevel()">حاول مرة أخرى 🔄</button>
        <button class="btn red" onclick="showScreen('mainMenu')">خروج 🏠</button>
    </div>

    <!-- واجهة اللعب -->
    <div id="hud">
        <button class="pause-btn" onclick="togglePause()">⏸️</button>
        <div class="progress-bar"><div class="fill" id="progFill"></div></div>
        <div class="stats">المحاولة: <span id="attCount">1</span></div>
    </div>
</div>

<script>
/** إعدادات اللعبة والمتغيرات **/
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

// ضبط الحجم
function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// حالة اللعبة
let gameState = 'MENU'; // MENU, PLAY, PAUSE, DEAD, WIN
let currentLevelId = 1;
let attempts = 1;
let cameraX = 0;
let particles = [];
let bgStars = [];

// اللاعب
const player = {
    x: 200, // ثابت أفقياً
    y: 0,
    size: 35,
    dy: 0,
    angle: 0,
    onGround: false,
    dead: false,
    color: '#00f5ff'
};

// الثوابت الفيزيائية
const GRAVITY = 0.65;
const JUMP = -11.5;
let SPEED = 5;

// بيانات المستويات (يتم توليدها)
const levelsData = [];

/** نظام الصوت (Web Audio API) **/
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = new AudioContext();

function playSound(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'jump') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, now);
        osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.5);
        osc.start(now); osc.stop(now + 0.5);
    }
}

/** توليد المراحل **/
function generateLevel(id, length, difficulty) {
    let obs = [];
    let x = 1000; // بداية آمنة
    while(x < length) {
        let type = Math.random() > 0.6 ? 'spike' : 'block';
        
        if (type === 'spike') {
            let count = 1;
            if(difficulty > 2 && Math.random() > 0.6) count = 2;
            if(difficulty > 4 && Math.random() > 0.6) count = 3;
            
            for(let i=0; i<count; i++) obs.push({t:'spike', x: x + (i*30)});
            x += (count * 30) + (Math.random() * 200 + 250); // مسافة أمان
        } else {
            obs.push({t:'block', x: x, w: 40, h: 40});
            // احتمالية وضع شوكة فوق أو بعد المكعب للمراحل الصعبة
            if(difficulty > 3 && Math.random() > 0.5) {
                obs.push({t:'spike', x: x + 40}); // شوكة ملاصقة
            }
            x += 40 + (Math.random() * 200 + 200);
        }
    }
    obs.push({t:'end', x: length});
    return obs;
}

// تعريف المراحل
const levelConfigs = [
    {id:1, name:"البداية", len:2000, diff:"سهل", col:"#2ecc71", bg:"#000000"},
    {id:2, name:"الصحراء", len:2500, diff:"سهل", col:"#f1c40f", bg:"#2c3e50"},
    {id:3, name:"المدينة", len:3000, diff:"متوسط", col:"#3498db", bg:"#1a1a2e"},
    {id:4, name:"الجنون", len:3500, diff:"صعب", col:"#e74c3c", bg:"#2c0000"},
    {id:5, name:"الجحيم", len:4500, diff:"مستحيل", col:"#9b59b6", bg:"#100020"}
];

levelConfigs.forEach((cfg, idx) => {
    levelsData.push({
        info: cfg,
        data: generateLevel(cfg.id, cfg.len, idx + 1)
    });
});

let currentObstacles = [];

/** التحكم **/
function handleInput(e) {
    if(e.code && e.code !== 'Space' && e.code !== 'ArrowUp') return;
    if(e.type === 'touchstart') e.preventDefault();

    if (gameState === 'PLAY') {
        if (player.onGround) {
            player.dy = JUMP;
            player.onGround = false;
            playSound('jump');
            createParticles(player.x, player.y + player.size, 5, '#fff');
        }
    }
}
window.addEventListener('keydown', handleInput);
window.addEventListener('mousedown', handleInput);
window.addEventListener('touchstart', handleInput, {passive:false});

/** منطق اللعبة الأساسي **/
function startGame(lvlIdx) {
    currentLevelId = lvlIdx;
    attempts = 1;
    resetPlayer();
    loadLevel(lvlIdx);
    showScreen(null);
    document.getElementById('hud').style.display = 'flex';
    updateUI();
    gameState = 'PLAY';
    loop();
}

function resetPlayer() {
    player.y = H - 150;
    player.dy = 0;
    player.angle = 0;
    player.onGround = false;
    player.dead = false;
    cameraX = 0;
    SPEED = levelConfigs[currentLevelId-1].id * 0.6 + 4.5; // زيادة السرعة مع كل مرحلة
    particles = [];
}

function loadLevel(idx) {
    currentObstacles = JSON.parse(JSON.stringify(levelsData[idx-1].data));
}

function restartLevel() {
    attempts++;
    resetPlayer();
    gameState = 'PLAY';
    showScreen(null);
    document.getElementById('hud').style.display = 'flex';
    updateUI();
    loop();
}

function nextLevel() {
    if(currentLevelId < levelsData.length) startGame(currentLevelId + 1);
    else showScreen('mainMenu');
}

function togglePause() {
    if(gameState === 'PLAY') {
        gameState = 'PAUSE';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0,0,W,H);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 40px Cairo';
        ctx.textAlign = 'center';
        ctx.fillText("موقوف مؤقت", W/2, H/2);
    } else if (gameState === 'PAUSE') {
        gameState = 'PLAY';
        loop();
    }
}

/** المحرك الفيزيائي والتصادم **/
function update() {
    if(gameState !== 'PLAY') return;

    cameraX += SPEED;

    // الجاذبية
    player.dy += GRAVITY;
    player.y += player.dy;

    // الدوران
    if(!player.onGround) player.angle += 0.12;
    else {
        // تصحيح الزاوية عند الهبوط
        const snap = Math.round(player.angle / (Math.PI/2)) * (Math.PI/2);
        player.angle = snap;
    }

    // الأرضية
    const floorY = H - 100;
    if(player.y + player.size >= floorY) {
        player.y = floorY - player.size;
        player.dy = 0;
        player.onGround = true;
    } else {
        player.onGround = false;
    }

    checkCollisions(floorY);

    // شريط التقدم
    const prog = Math.min(100, (cameraX / levelsData[currentLevelId-1].info.len) * 100);
    document.getElementById('progFill').style.width = prog + '%';
}

function checkCollisions(floorY) {
    // مربع تصادم اللاعب (أصغر قليلاً للعدالة)
    const pL = player.x + 6;
    const pR = player.x + player.size - 6;
    const pT = player.y + 6;
    const pB = player.y + player.size - 2;

    for(let obs of currentObstacles) {
        const oX = obs.x - cameraX;
        if(oX < -100 || oX > W + 100) continue;

        // خط النهاية
        if(obs.t === 'end') {
            if(oX < player.x) winLevel();
            continue;
        }

        // المكعبات
        if(obs.t === 'block') {
            const bL = oX;
            const bR = oX + obs.w;
            const bT = floorY - obs.h;
            const bB = floorY;

            if(pR > bL && pL < bR && pB > bT && pT < bB) {
                // هل هبطنا عليه؟
                const prevBottom = (player.y - player.dy) + player.size;
                if(prevBottom <= bT + 5 && player.dy >= 0) {
                    player.y = bT - player.size;
                    player.dy = 0;
                    player.onGround = true;
                } else {
                    die(); // صدمة جانبية
                }
            }
        }

        // الشوك
        if(obs.t === 'spike') {
            const sL = oX + 8;
            const sR = oX + 22;
            const sT = floorY - 30;
            const sB = floorY;

            if(pR > sL && pL < sR && pB > sT + 5 && pT < sB) {
                die();
            }
        }
    }
}

function die() {
    if(player.dead) return;
    player.dead = true;
    gameState = 'DEAD';
    playSound('die');
    
    // اهتزاز
    canvas.style.transform = `translate(${Math.random()*20-10}px, ${Math.random()*20-10}px)`;
    setTimeout(()=>canvas.style.transform='none', 200);

    createParticles(player.x + player.size/2, player.y + player.size/2, 40, player.color);

    setTimeout(() => {
        document.getElementById('deathText').innerText = `المحاولات: ${attempts}`;
        showScreen('deathScreen');
    }, 800);
}

function winLevel() {
    gameState = 'WIN';
    playSound('win');
    saveProgress(currentLevelId);
    document.getElementById('winText').innerText = `أنهيت المرحلة في ${attempts} محاولة`;
    showScreen('winScreen');
}

/** الرسم **/
function draw() {
    const lvlInfo = levelsData[currentLevelId-1].info;
    
    // خلفية
    ctx.fillStyle = lvlInfo.bg;
    ctx.fillRect(0,0,W,H);

    // شبكة الخلفية
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const off = cameraX % 50;
    for(let x=-off; x<W; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for(let y=0; y<H; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // أرضية
    const floorY = H - 100;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, floorY, W, 100);
    ctx.strokeStyle = lvlInfo.col;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0,floorY); ctx.lineTo(W,floorY); ctx.stroke();

    // عقبات
    for(let obs of currentObstacles) {
        const dx = obs.x - cameraX;
        if(dx < -50 || dx > W+50) continue;

        if(obs.t === 'spike') {
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(dx, floorY);
            ctx.lineTo(dx+15, floorY-30);
            ctx.lineTo(dx+30, floorY);
            ctx.fill();
        } else if(obs.t === 'block') {
            ctx.fillStyle = '#000';
            ctx.fillRect(dx, floorY-obs.h, obs.w, obs.h);
            ctx.strokeStyle = lvlInfo.col;
            ctx.lineWidth = 2;
            ctx.strokeRect(dx, floorY-obs.h, obs.w, obs.h);
        }
    }

    // لاعب
    if(!player.dead) {
        ctx.save();
        ctx.translate(player.x + player.size/2, player.y + player.size/2);
        ctx.rotate(player.angle);
        ctx.fillStyle = player.color;
        ctx.shadowBlur = 15;
        ctx.shadowColor = player.color;
        ctx.fillRect(-player.size/2, -player.size/2, player.size, player.size);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(-player.size/2, -player.size/2, player.size, player.size);
        // عين
        ctx.fillStyle = '#000';
        ctx.fillRect(5, -5, 8, 8);
        ctx.restore();
    }

    // جسيمات
    updateParticles();
}

function createParticles(x,y,cnt,col) {
    for(let i=0; i<cnt; i++) {
        particles.push({
            x:x, y:y,
            vx:(Math.random()-0.5)*10,
            vy:(Math.random()-0.5)*10,
            l:1, c:col
        });
    }
}

function updateParticles() {
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.l -= 0.03;
        if(p.l <= 0) particles.splice(i,1);
        else {
            ctx.globalAlpha = p.l;
            ctx.fillStyle = p.c;
            ctx.fillRect(p.x, p.y, 4, 4);
            ctx.globalAlpha = 1;
        }
    }
}

function loop() {
    if(gameState === 'PLAY') {
        update();
        draw();
        requestAnimationFrame(loop);
    } else if(gameState === 'DEAD' || gameState === 'WIN') {
        draw();
        if(particles.length > 0) requestAnimationFrame(loop);
    }
}

/** إدارة الواجهة **/
function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    if(id) document.getElementById(id).classList.add('active');
    if(!id) document.getElementById('hud').style.display = 'flex';
    else if(id !== 'hud') document.getElementById('hud').style.display = 'none';
}

function updateUI() {
    document.getElementById('attCount').innerText = attempts;
}

function renderLevels() {
    const cont = document.getElementById('levelsContainer');
    cont.innerHTML = '';
    levelsData.forEach((lvl, idx) => {
        const div = document.createElement('div');
        div.className = 'level-card';
        let diffClass = lvl.info.diff === 'سهل' ? 'easy' : lvl.info.diff === 'متوسط' ? 'medium' : lvl.info.diff === 'صعب' ? 'hard' : 'insane';
        
        div.innerHTML = `
            <div class="lvl-num">${lvl.info.id}</div>
            <div class="lvl-name">${lvl.info.name}</div>
            <div class="lvl-diff ${diffClass}">${lvl.info.diff}</div>
        `;
        div.onclick = () => startGame(lvl.info.id);
        cont.appendChild(div);
    });
}

function saveProgress(id) {
    localStorage.setItem('gd_completed_' + id, 'true');
}
function clearData() {
    localStorage.clear();
    alert('تم حذف التقدم!');
}

// البدء
renderLevels();
function menuAnim() {
    if(gameState === 'MENU') {
        ctx.fillStyle = '#111';
        ctx.fillRect(0,0,W,H);
        if(Math.random()>0.9) {
            ctx.fillStyle='#fff';
            ctx.fillRect(Math.random()*W, Math.random()*H, 2, 2);
        }
        requestAnimationFrame(menuAnim);
    }
}
menuAnim();

</script>
</body>
</html>
